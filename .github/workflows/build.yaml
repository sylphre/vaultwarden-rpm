name: Build Vaultwarden .rpm packages

concurrency: ci-build

on:
  - push
  - workflow_dispatch
  - workflow_call

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get latest versions
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python generate-files.py
        if grep -q VW_HAS_UPDATE=true ${GITHUB_ENV} ; then
          echo "Upstream changes detected."
          exit 1
        fi


  build-rpms:
    runs-on: ubuntu-latest
    needs: check-version

    strategy:
      matrix:
        alma: ["9", "10"]
        alma-arch: ["x86_64"]

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get -q update
        sudo apt-get -qy install rpm createrepo-c

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import GPG key
      id: import_gpg
      uses: gvtulder/ghaction-import-gpg@master
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Get latest versions
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python generate-files.py

    - name: Download previous rpm files
      env:
        AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: auto
      run: |
        mkdir -p repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}
        ./sync-s3.sh s3://${{ secrets.AWS_S3_BUCKET }}/el/${{ matrix.alma }} repo/el/${{ matrix.alma }}

    - name: Build vaultwarden .rpm
      env:
        ALMA_TARGET_VERSION: ${{ matrix.alma }}
        VW_SERVER_VERSION: ${{ env.VW_SERVER_VERSION }}
        VW_WEB_VERSION: ${{ env.VW_WEB_VERSION }}
        GPG_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        PKG=vaultwarden-${{ env.VW_SERVER_VERSION_RPM }}.el${{ matrix.alma }}.${{ matrix.alma-arch }}.rpm
        if [[ ! -f repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/$PKG ]] ; then
          cd vaultwarden/
          ./build-in-docker.sh
          ../sign-rpm.sh vaultwarden-*.rpm
          mv vaultwarden-*.rpm ../repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/
          cd ..
        fi

    - name: Build vaultwarden-web-vault .rpm
      env:
        VW_WEB_VERSION: ${{ env.VW_WEB_VERSION }}
        GPG_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        PKG=vaultwarden-web-vault-${{ env.VW_WEB_VERSION_RPM }}.el${{ matrix.alma }}.noarch.rpm
        if [[ ! -f repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/$PKG ]] ; then
          cd vaultwarden-web-vault/
          make rpm DIST=.el${{ matrix.alma }}
          ../sign-rpm.sh out/noarch/vaultwarden-web-vault-*.rpm
          mv out/noarch/vaultwarden-web-vault-*.rpm ../repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/
          cd ..
        fi

    - name: Export public key
      run: |
        gpg --armor --export ${{ steps.import_gpg.outputs.keyid }} > repo/RPM-GPG-KEY-vaultwarden-rpm

    - name: Create yum repository
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        cd repo/el/${{ matrix.alma }}/${{ matrix.alma-arch }}

        createrepo_c --update --general-compress-type=gz .

        # repo_gpgcheck=1 on the client side verifies this detached signature
        rm -f repodata/repomd.xml.asc
        gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --digest-algo sha256 \
            -u ${{ steps.import_gpg.outputs.keyid }} \
            --detach-sign --armor repodata/repomd.xml

        cd ../../../..

    - name: Upload updated repo
      env:
        AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: auto
      run: |
        ./sync-s3.sh repo/ s3://${{ secrets.AWS_S3_BUCKET }}/

    - name: Archive .rpm files, public keys, repodata
      uses: actions/upload-artifact@v4
      with:
        name: output-el${{ matrix.alma }}
        path: repo/


  build-repo:
    runs-on: ubuntu-latest
    needs: build-rpms

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get -q update
        sudo apt-get -qy install rpm createrepo-c

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import GPG key
      id: import_gpg
      uses: gvtulder/ghaction-import-gpg@master
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        path: repo-src/

    - name: Show all files
      run: |
        find

    - name: Create combined repository
      run: |
        mkdir -p repo/el
        for release_dir in repo-src/output-el*/el ; do
          cp -r $release_dir/* repo/el
        done

    - name: Export public key
      run: |
        gpg --armor --export ${{ steps.import_gpg.outputs.keyid }} > repo/RPM-GPG-KEY-vaultwarden-rpm

    - name: Upload updated repo
      env:
        AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: auto
      run: |
        ./sync-s3.sh repo/ s3://${{ secrets.AWS_S3_BUCKET }}/

    - name: Archive repository files
      uses: actions/upload-artifact@v4
      with:
        name: combined-repository
        path: repo/


  deploy:
    runs-on: ubuntu-latest
    needs: build-repo

    steps:
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          curl -X POST "${CLOUDFLARE_DEPLOY_HOOK}"
