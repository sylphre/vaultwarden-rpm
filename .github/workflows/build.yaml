name: Build Vaultwarden .rpm packages

concurrency: ci-build

on:
  - push
  - workflow_dispatch
  - workflow_call

env:
  # where the gh-pages branch ends up being served from
  PAGES_URL: https://sylphre.github.io/vaultwarden-rpm

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get latest versions
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python generate-files.py
        if grep -q VW_HAS_UPDATE=true ${GITHUB_ENV} ; then
          echo "Upstream changes detected."
          exit 1
        fi


  build-rpms:
    runs-on: ubuntu-latest
    needs: check-version

    strategy:
      matrix:
        alma: ["9", "10"]
        alma-arch: ["x86_64"]

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get -q update
        sudo apt-get -qy install rpm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Get latest versions
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python generate-files.py

    - name: List already published packages
      run: |
        # blobless, no-checkout clone: fetches the file *names* on gh-pages
        # without downloading a single rpm
        git clone --branch gh-pages --depth 1 --filter=blob:none --no-checkout \
            https://github.com/${{ github.repository }}.git gh-pages-index \
          && git -C gh-pages-index ls-tree -r --name-only HEAD > published.txt \
          || touch published.txt
        cat published.txt

    - name: Build vaultwarden .rpm
      env:
        ALMA_TARGET_VERSION: ${{ matrix.alma }}
        VW_SERVER_VERSION: ${{ env.VW_SERVER_VERSION }}
        VW_WEB_VERSION: ${{ env.VW_WEB_VERSION }}
        GPG_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        PKG=vaultwarden-${{ env.VW_SERVER_VERSION_RPM }}.el${{ matrix.alma }}.${{ matrix.alma-arch }}.rpm
        mkdir -p dist/el/${{ matrix.alma }}/${{ matrix.alma-arch }}
        if ! grep -qxF "el/${{ matrix.alma }}/${{ matrix.alma-arch }}/$PKG" published.txt ; then
          cd vaultwarden/
          ./build-in-docker.sh
          ../sign-rpm.sh vaultwarden-*.rpm
          mv vaultwarden-*.rpm ../dist/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/
          cd ..
        fi

    - name: Build vaultwarden-web-vault .rpm
      env:
        VW_WEB_VERSION: ${{ env.VW_WEB_VERSION }}
        GPG_KEY_ID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        PKG=vaultwarden-web-vault-${{ env.VW_WEB_VERSION_RPM }}.el${{ matrix.alma }}.noarch.rpm
        if ! grep -qxF "el/${{ matrix.alma }}/${{ matrix.alma-arch }}/$PKG" published.txt ; then
          cd vaultwarden-web-vault/
          make rpm DIST=.el${{ matrix.alma }}
          ../sign-rpm.sh out/noarch/vaultwarden-web-vault-*.rpm
          mv out/noarch/vaultwarden-web-vault-*.rpm ../dist/el/${{ matrix.alma }}/${{ matrix.alma-arch }}/
          cd ..
        fi

    - name: Archive newly built .rpm files
      uses: actions/upload-artifact@v4
      with:
        name: rpms-el${{ matrix.alma }}
        path: dist/
        if-no-files-found: ignore


  publish:
    runs-on: ubuntu-latest
    needs: build-rpms

    permissions:
      contents: write

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get -q update
        sudo apt-get -qy install rpm createrepo-c

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Download newly built .rpm files
      uses: actions/download-artifact@v4
      with:
        path: new-rpms/

    - name: Check out the published repository
      run: |
        git clone --branch gh-pages --depth 1 \
            https://github.com/${{ github.repository }}.git repo \
          || mkdir -p repo
        rm -rf repo/.git
        mkdir -p repo/el

    - name: Add the new packages
      run: |
        shopt -s nullglob
        for dir in new-rpms/rpms-el*/el ; do
          cp -r "$dir/." repo/el/
        done
        find repo/el -name '*.rpm' | sort

    - name: Create yum repositories
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        shopt -s nullglob
        for dir in repo/el/*/x86_64 ; do
          createrepo_c --update --general-compress-type=gz "$dir"

          # repo_gpgcheck=1 on the client side verifies this detached signature
          rm -f "$dir/repodata/repomd.xml.asc"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --digest-algo sha256 \
              -u ${{ steps.import_gpg.outputs.keyid }} \
              --detach-sign --armor "$dir/repodata/repomd.xml"
        done

    - name: Export public key
      run: |
        gpg --armor --export ${{ steps.import_gpg.outputs.keyid }} > repo/RPM-GPG-KEY-vaultwarden-rpm

    - name: Build the repository index
      run: |
        ./build-pages.sh repo

    - name: Push to gh-pages
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd repo
        # a fresh history every run: the branch keeps the files, not the churn
        git init -q -b gh-pages
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git add -A
        git commit -q -m "Update repository ($(date -u +%Y-%m-%d))"
        git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

    - name: Archive repository files
      uses: actions/upload-artifact@v4
      with:
        name: combined-repository
        path: |
          repo/
          !repo/.git
